name: Media kit stats

on:
  schedule:
    - cron: "17 10 * * *"   # every day around 6am Eastern
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/223493823698/locations/global/workloadIdentityPools/github/providers/observe-report
          service_account: stats-reader@observe-report-stats.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly

      - name: Pull the numbers
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_HANDLE: "@Observe-Report"
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/media_kit_stats.py

      - name: Save the renewed Instagram token
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          f="$RUNNER_TEMP/ig_new_token"
          if [ -s "$f" ]; then
            if [ -n "$GH_TOKEN" ]; then
              gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < "$f" && echo "Instagram token renewed."
            else
              echo "::warning::Instagram token was refreshed but not saved: add the SECRETS_PAT secret so it can renew itself."
            fi
            rm -f "$f"
          fi

      - name: Save to the site
        run: |
          git config user.name "media-kit-bot"
          git config user.email "media-kit-bot@users.noreply.github.com"
          git add data/stats-auto.json data/stats-history.json
          git diff --cached --quiet || (git commit -m "Refresh media kit stats" && git push)
